name: Validate Plugin and Skills

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run deterministic contracts
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Install official Agent Skills reference validator
        run: python -m pip install "git+https://github.com/agentskills/agentskills.git#subdirectory=skills-ref"

      - name: Validate every Skill
        shell: bash
        run: |
          set -euo pipefail
          for skill in plugins/plans-steps-pr-skills/skills/*; do
            skills-ref validate "$skill"
          done
